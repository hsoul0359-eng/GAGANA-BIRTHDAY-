<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      color: #5a2430;
      overflow-x: hidden;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      margin-bottom: 15px;
      animation: fadeDown 1.2s ease;
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 50px;
      animation: fadeUp 1.5s ease;
    }

    /* PHOTO GRID */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .photo-card {
      position: relative;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .photo-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .photo-card:hover img {
      transform: scale(1.08);
    }

    .photo-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.75)
      );
      color: white;
      font-size: 1rem;
      text-align: left;
    }

    /* POPUP */

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .popup.active {
      display: flex;
    }

    .popup-content {
      position: relative;
      max-width: 500px;
      width: 100%;
      background: #fff5f7;
      border-radius: 25px;
      padding: 40px 30px;
      text-align: center;
      animation: popupIn 0.35s ease;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .popup-content h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .popup-content p {
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      border: none;
      background: none;
      font-size: 30px;
      cursor: pointer;
      color: #5a2430;
    }

    /* HEARTS */

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
      opacity: 0.7;
    }

    /* ANIMATIONS */

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .photo-grid {
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .photo-card {
        height: 220px;
      }

      .popup-content {
        padding: 35px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎂 Happy Birthday ❤️</h1>

    <p class="subtitle">
      A little collection of memories, wishes and special moments ✨
    </p>

    <div class="photo-grid">

      <!-- PHOTO 1 -->
      <div
        class="photo-card"
        onclick="showMessage(
          'A Special Memory ❤️',
          'Every moment captured here is a memory I will always treasure. Happy Birthday!'
        )"
      >
        <img src="photos/photo1.jpg" alt="Memory 1">
        <div class="photo-label">A beautiful memory ❤️</div>
      </div>


      <!-- PHOTO 2 -->
      <div
        class="photo-card"
        onclick="showMessage(
          'Another Beautiful Moment ✨',
          'May your birthday be filled with happiness, laughter and everything your heart wishes for.'
        )"
      >
        <img src="photos/photo2.jpg" alt="Memory 2">
        <div class="photo-label">One more memory ✨</div>
      </div>


      <!-- PHOTO 3 -->
      <div
        class="photo-card"
        onclick="showMessage(
          'Keep Smiling 😊',
          'Your smile makes every moment brighter. Never stop smiling and keep being amazing!'
        )"
      >
        <img src="photos/photo3.jpg" alt="Memory 3">
        <div class="photo-label">Keep smiling 😊</div>
      </div>


      <!-- PHOTO 4 -->
      <div
        class="photo-card"
        onclick="showMessage(
          'For You 💕',
          'Wishing you a year full of beautiful surprises, unforgettable memories and endless happiness.'
        )"
      >
        <img src="photos/photo4.jpg" alt="Memory 4">
        <div class="photo-label">Just for you 💕</div>
      </div>

    </div>

  </div>


  <!-- POPUP -->

  <div class="popup" id="popup">

    <div class="popup-content">

      <button class="close-btn" onclick="closeMessage()">
        ×
      </button>

      <h2 id="popupTitle"></h2>

      <p id="popupMessage"></p>

    </div>

  </div>


  <script>

    function showMessage(title, message) {

      document.getElementById("popupTitle").textContent = title;

      document.getElementById("popupMessage").textContent = message;

      document.getElementById("popup").classList.add("active");

    }


    function closeMessage() {

      document.getElementById("popup").classList.remove("active");

    }


    // Close popup when clicking outside it

    document.getElementById("popup").addEventListener("click", function(event) {

      if (event.target === this) {
        closeMessage();
      }

    });


    // Floating hearts

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "heart";

      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (Math.random() * 3 + 3) + "s";

      heart.style.fontSize =
        (Math.random() * 15 + 15) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);

    }


    setInterval(createHeart, 700);

  </script>

</body>
